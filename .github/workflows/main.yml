name: test data

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  pull-requests: write

jobs:
  test-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.66.0
          activate-environment: "ci"
      - name: run tests
        working-directory: tests
        run: |
            Rscript -e "testthat::test_dir('.', filter = 'phonemes', invert = TRUE, stop_on_failure = TRUE)"
      ## The following steps are temporary until we fix the phoneme feature test to pass in CI. 
      ## Once the phoneme feature test passes, update the above command and remove filter and invert, and delete the following steps.
      - name: run feature test (write to PR comment)
        working-directory: tests
        run: |
          Rscript -e "testthat::test_file('test-phonemes.R', reporter = 'summary')" > phoneme_feature_test_results.txt 2>&1 || true
      ## Adds a comment to the PR with the results of the phoneme feature test.
      - name: comment on PR
        if: github.event_name == 'pull_request'
        working-directory: tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file phoneme_feature_test_results.txt
