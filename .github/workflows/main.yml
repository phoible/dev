name: test data

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.66.0
          activate-environment: "ci"
      - name: run tests
        working-directory: tests
        run: |
          Rscript -e "testthat::test_dir('.', stop_on_failure=TRUE)"
